<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق الدراسة</title>
<style>
  html,body{height:100%;margin:0;background:#0F1420;color:#E8ECF4;
    font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;text-align:center}
  .box{padding:28px;max-width:22rem}
  h1{font-size:1.35rem;margin:0 0 10px}
  p{color:#93A0B8;line-height:1.6;margin:0 0 20px}
  button{background:#6C5CE7;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem}
</style></head>
<body><div class="box">
  <h1>لا يوجد اتصال</h1>
  <p>يحتاج رفيق الدراسة إلى الإنترنت للوصول إلى خدمات الذكاء الاصطناعي. تحقّق من اتصالك ثم أعد المحاولة.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div></body></html>
