name: Build Android APK

# The APK is built here rather than on a laptop: GitHub's runners already
# have the Android SDK, so nobody needs to install 1.5 GB of tooling to get
# an installable file.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site the app should open (leave blank for the default)"
        required: false
        default: ""
  push:
    branches: [claude/master-study-support-site-8g04ww]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "native/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22, and pdfjs-dist wants
          # 22.13+. Node 20 fails this build before it reaches Gradle.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync the shell
        # Rewrites android/app/src/main/assets/capacitor.config.json from
        # capacitor.config.ts, so the URL below actually reaches the app.
        env:
          STUDY_BUDDY_URL: ${{ github.event.inputs.site_url }}
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Show what was built
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: study-buddy-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK to the apk-build branch
        # An Actions artifact can only be fetched by someone signed in to
        # GitHub, from a storage host that is not reachable everywhere. A
        # branch is plain HTTPS, so the APK can be downloaded directly:
        #   raw.githubusercontent.com/<owner>/<repo>/apk-build/study-buddy.apk
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk"
          work=$(mktemp -d)
          cp "$apk" "$work/study-buddy.apk"
          cd "$work"
          {
            echo "# رفيق الدراسة — APK"
            echo
            echo "Built by GitHub Actions. This branch holds only the built app."
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- size: $(du -h study-buddy.apk | cut -f1)"
            echo
            echo "Download: study-buddy.apk, then open it on the phone."
          } > README.md
          git init -q
          git checkout -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APK built from $GITHUB_SHA"
          # Force: this branch is a drop box for the latest build, not history.
          git push -q --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" apk-build
          echo "published to the apk-build branch"

